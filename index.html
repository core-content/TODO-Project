<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8f7">
    <title>Daylist | My tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Daylist home"><span class="brand-mark" aria-hidden="true">&#10003;</span>daylist<span class="brand-dot">.</span></a>
      <span class="header-note">A little more done.</span>
    </header>

    <main>
      <div class="page-heading">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1>My tasks<span class="heading-dot">.</span></h1>
          <p class="subtitle">One thing at a time.</p>
        </div>
        <div class="progress-summary" aria-label="Task progress">
          <span id="progress-count">0 / 0</span>
          <span>completed</span>
        </div>
      </div>

      <form id="task-form" autocomplete="off">
        <label class="sr-only" for="task-input">New task</label>
        <span class="input-plus" aria-hidden="true">+</span>
        <input id="task-input" name="task" placeholder="What needs to get done?" maxlength="300" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
      </form>

      <section class="task-section" aria-label="Tasks">
        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" class="filter selected" data-filter="all" aria-pressed="true">All <span id="all-count">0</span></button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">Active <span id="active-count">0</span></button>
            <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed <span id="completed-count">0</span></button>
          </div>
          <span class="list-label">YOUR LIST</span>
        </div>

        <ul id="task-list" aria-label="Task list"></ul>
        <div class="empty-state" id="empty-state">
          <span class="empty-mark" aria-hidden="true">&#10003;</span>
          <h2 id="empty-title">A fresh start.</h2>
          <p id="empty-description">Nothing on your list yet.</p>
        </div>

        <footer class="list-footer">
          <span id="remaining-count">0 tasks left</span>
          <button type="button" id="clear-completed" disabled>Clear completed</button>
        </footer>
      </section>
      <p class="storage-note" id="storage-note">Your tasks, saved in this browser.</p>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </main>
    <footer class="page-footer">Less noise. More focus.</footer>
  </body>
</html>
